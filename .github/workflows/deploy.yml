name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # historial sencer: la portada tria els «Últims canvis» per la data de l'últim commit de cada fitxer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Adreça de l'API de missions
        run: |
          if [ -z "${{ vars.MISSIONS_API_URL }}" ]; then
            echo "::error::Falta la variable MISSIONS_API_URL (Settings → Secrets and variables → Actions → Variables): l'adreça pública de l'API de missions de la Mac mini. Sense ella el tauler no sabria on anar i no es publica res."
            exit 1
          fi
      - run: npm run check
      - run: npm run build
        env:
          PUBLIC_MISSIONS_API_URL: ${{ vars.MISSIONS_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
